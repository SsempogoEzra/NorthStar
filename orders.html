<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Order Status - North Star Retail</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <style>
            :root{
            --bg-dark:#0B0F17;
            --surface-dark:#161C27;
            --border-dark:#1F2633;
            --primary-blue:#2563EB;
            --primary-blue-glow:rgba(37,99,235,0.28);
            --success-green:#16A34A;
            --success-green-glow:rgba(22,163,74,0.28);
            --amber:#F59E0B;
            --amber-glow:rgba(245,158,11,0.28);
            --text-main:#F9FAFB;
            --text-muted:#9CA3AF;
            --text-faint:#5B6472;
            --font-family:'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --sidebar-w:240px;
            --radius:10px;
        }

        *{box-sizing:border-box;}
        html,body{margin:0;padding:0;}
        body{
            background:var(--bg-dark);
            color:var(--text-main);
            font-family:var(--font-family);
            min-height:100vh;
        }
        a{color:inherit;text-decoration:none;}
        button{font-family:var(--font-family);}

        .app{
            display:flex;
            min-height:100vh;
        }

        .sidebar{
            width:var(--sidebar-w);
            flex-shrink:0;
            background:var(--surface-dark);
            border-right:1px solid var(--border-dark);
            padding:24px 16px;
            display:flex;
            flex-direction:column;
            position:sticky;
            top:0;
            height:100vh;
        }
        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            padding:6px 8px 28px;
            font-weight:700;
            font-size:14px;
            letter-spacing:0.04em;
            text-transform:uppercase;
        }
        .brand .brand-icon{width:18px;height:18px;color:var(--primary-blue);}

        .nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
        .nav-item{
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 12px;
            border-radius:8px;
            color:var(--text-muted);
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:background .15s ease, color .15s ease;
        }
        .nav-item svg{width:18px;height:18px;flex-shrink:0;}
        .nav-item:hover{background:var(--border-dark);color:var(--text-main);}
        .nav-item.active{background:var(--primary-blue);color:#fff;}
        .nav-item.active svg{color:#fff;}

        .main{
            flex:1;
            min-width:0;
            padding:36px 40px 100px;
        }
        .content{max-width:760px;margin:0 auto;}

        .breadcrumb{
            font-size:12.5px;
            color:var(--text-faint);
            margin-bottom:10px;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .breadcrumb .sep{color:var(--text-faint);}
        .breadcrumb .current{color:var(--text-muted);}

        h1.page-title{
            font-size:24px;
            font-weight:700;
            letter-spacing:-0.01em;
            margin:0 0 4px;
        }
        .page-sub{
            color:var(--text-muted);
            font-size:14px;
            margin:0 0 24px;
        }

        .switcher{
            display:flex;
            gap:8px;
            margin-bottom:22px;
            border-bottom:1px solid var(--border-dark);
        }
        .switcher button{
            background:none;
            border:none;
            color:var(--text-faint);
            font-size:13px;
            font-weight:600;
            padding:10px 4px 12px;
            cursor:pointer;
            position:relative;
            letter-spacing:0.01em;
            transition:color .15s ease;
        }
        .switcher button + button{margin-left:22px;}
        .switcher button.active{color:var(--text-main);}
        .switcher button.active::after{
            content:'';
            position:absolute;
            left:0;right:0;bottom:-1px;
            height:2px;
            background:var(--primary-blue);
            border-radius:2px;
        }
        .switcher button:hover{color:var(--text-main);}

        .card{
            background:var(--surface-dark);
            border:1px solid var(--border-dark);
            border-radius:var(--radius);
            padding:24px;
            margin-bottom:16px;
        }

        .order-head{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            margin-bottom:24px;
            flex-wrap:wrap;
            gap:12px;
        }
        .order-number{
            font-size:12px;
            color:var(--text-faint);
            letter-spacing:0.03em;
            margin-bottom:6px;
            font-weight:500;
        }
        .order-date{
            font-size:14px;
            color:var(--text-muted);
        }
        .order-date strong{color:var(--text-main);font-weight:600;}

        .status-pill{
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding:6px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
            letter-spacing:0.01em;
            white-space:nowrap;
        }
        .status-pill svg{width:13px;height:13px;}
        .status-pill.status-amber{background:rgba(245,158,11,0.14);color:var(--amber);border:1px solid rgba(245,158,11,0.3);}
        .status-pill.status-blue{background:rgba(37,99,235,0.16);color:#7fa5f5;border:1px solid rgba(37,99,235,0.35);}
        .status-pill.status-green{background:rgba(22,163,74,0.16);color:#4fd394;border:1px solid rgba(22,163,74,0.35);}

        .stepper{padding:2px 0;}
        .step{
            position:relative;
            display:flex;
            gap:16px;
            padding-bottom:24px;
        }
        .step:last-child{padding-bottom:0;}
        .step-rail{
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:center;
            width:26px;
            flex-shrink:0;
        }
        .step-node{
            width:26px;height:26px;
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            background:var(--bg-dark);
            border:1.5px solid var(--border-dark);
            z-index:2;
            transition:all .2s ease;
        }
        .step-node svg{width:12px;height:12px;}
        .step-line{
            width:2px;
            flex:1;
            min-height:24px;
            background:var(--border-dark);
            margin-top:2px;
        }
        .step-body{padding-top:3px;}
        .step-label{
            font-size:14px;
            font-weight:500;
            color:var(--text-faint);
            transition:color .15s ease;
        }
        .step-meta{
            font-size:12px;
            color:var(--text-faint);
            margin-top:2px;
            display:none;
        }

        .step.done .step-label{color:var(--text-muted);}
        .step.done .step-line{background:var(--primary-blue);opacity:0.5;}

        .step.done.c-amber .step-node{background:var(--amber);border-color:var(--amber);}
        .step.done.c-blue .step-node{background:var(--primary-blue);border-color:var(--primary-blue);}
        .step.done.c-green .step-node{background:var(--success-green);border-color:var(--success-green);}
        .step.done .step-node svg{color:#0B0F17;}

        .step.current .step-label{color:var(--text-main);font-weight:600;}
        .step.current .step-meta{display:block;}
        .step.current .step-node{width:30px;height:30px;margin:-2px 0 0 -2px;}
        .step.current.c-amber .step-node{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-glow);}
        .step.current.c-blue .step-node{background:var(--primary-blue);border-color:var(--primary-blue);box-shadow:0 0 0 5px var(--primary-blue-glow);}
        .step.current.c-green .step-node{background:var(--success-green);border-color:var(--success-green);box-shadow:0 0 0 5px var(--success-green-glow);}
        .step.current .step-node svg{color:#0B0F17;}

        .tracking-title{
            font-size:11.5px;
            text-transform:uppercase;
            letter-spacing:0.08em;
            color:var(--text-faint);
            font-weight:600;
            margin-bottom:4px;
        }
        .tracking-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:14px;
            padding:11px 0;
            border-bottom:1px solid var(--border-dark);
        }
        .tracking-row:last-of-type{border-bottom:none;}
        .tracking-row .label{color:var(--text-muted);}
        .tracking-row .value{color:var(--text-main);font-weight:500;font-size:13.5px;}

        .track-btn{
            margin-top:14px;
            width:100%;
            background:var(--primary-blue);
            color:#fff;
            border:none;
            font-weight:600;
            font-size:14px;
            padding:12px 18px;
            border-radius:8px;
            cursor:pointer;
            transition:filter .15s ease, transform .15s ease;
            display:flex;align-items:center;justify-content:center;gap:8px;
        }
        .track-btn svg{width:15px;height:15px;}
        .track-btn:hover{filter:brightness(1.1);}
        .track-btn:active{transform:scale(0.99);}

        .back-button {

            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 150ms ease;
        }

        .back-button:hover {
            opacity: 0.75;
        }


        .toast{
            position:fixed;
            left:50%;
            bottom:28px;
            transform:translate(-50%,20px);
            background:var(--surface-dark);
            border:1px solid var(--border-dark);
            color:var(--text-main);
            font-size:13.5px;
            padding:12px 20px;
            border-radius:8px;
            opacity:0;
            pointer-events:none;
            transition:opacity .2s ease, transform .2s ease;
            box-shadow:0 8px 30px rgba(0,0,0,0.5);
            white-space:nowrap;
            z-index:50;
        }
        .toast.show{opacity:1;transform:translate(-50%,0);}

        .bottom-nav{
            display:none;
            position:fixed;
            bottom:0;left:0;right:0;
            background:var(--surface-dark);
            border-top:1px solid var(--border-dark);
            padding:8px 6px calc(8px + env(safe-area-inset-bottom));
            z-index:40;
        }
        .bottom-nav-list{
            list-style:none;margin:0;padding:0;
            display:flex;justify-content:space-around;
        }
        .bottom-nav-item{
            display:flex;flex-direction:column;align-items:center;gap:3px;
            color:var(--text-faint);
            font-size:10.5px;
            font-weight:500;
            cursor:pointer;
            padding:4px 8px;
        }
        .bottom-nav-item svg{width:20px;height:20px;}
        .bottom-nav-item.active{color:var(--primary-blue);}

        @media (max-width:768px){
            .sidebar{display:none;}
            .main{padding:24px 16px 90px;}
            .bottom-nav{display:block;}
            .order-head{gap:10px;}
        }
        </style>

    </head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <i data-lucide="sparkle" class="brand-icon"></i>
      NORTH STAR RETAIL
    </div>
    <ul class="nav-list">
      <li class="nav-item"><i data-lucide="home"></i>Overview</li>
      <li class="nav-item active"><i data-lucide="package"></i>Orders</li>
      <li class="nav-item"><i data-lucide="refresh-cw"></i>Returns &amp; Refunds</li>
      <li class="nav-item"><i data-lucide="ticket"></i>File a Ticket</li>
    </ul>
  </aside>

  <main class="main">
    <div class="content">
      <div class="breadcrumb">
        <button class="back-button" type="button" aria-label="Go back" onclick="window.location.href='dashboard.html'">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
        </button>
        <span>Orders</span><span class="sep">/</span><span class="current">Order Status</span>
      </div>
      <h1 class="page-title">Order Status</h1>
      <p class="page-sub">Track the progress of your recent orders.</p>

      <div class="switcher" id="switcher"></div>

      <div class="card" id="orderCard"></div>
      <div class="card" id="trackingCard"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <ul class="bottom-nav-list">
    <li class="bottom-nav-item"><i data-lucide="home"></i>Overview</li>
    <li class="bottom-nav-item active"><i data-lucide="package"></i>Orders</li>
    <li class="bottom-nav-item"><i data-lucide="refresh-cw"></i>Returns</li>
    <li class="bottom-nav-item"><i data-lucide="ticket"></i>Ticket</li>
  </ul>
</nav>

<div class="toast" id="toast">Tracking link would open here</div>

    <script>
        const STEPS = ["Order Placed","Order Confirmed / Processing","Shipped","Out for Delivery","Delivered"];

        const STEP_COLOR = {
        "Order Placed":"amber",
        "Order Confirmed / Processing":"amber",
        "Shipped":"blue",
        "Out for Delivery":"blue",
        "Delivered":"green"
        };

        const STEP_ICON = {
        "Order Placed":"package",
        "Order Confirmed / Processing":"check-circle-2",
        "Shipped":"truck",
        "Out for Delivery":"truck",
        "Delivered":"check-check"
        };

        const ORDERS = {
        "NS12346": {
            orderNumber: "NS12346",
            status: "Delivered",
            dateLabel: "Delivered",
            date: "August 13, 2026",
            carrier: "North Star Shipping",
            trackingNumber: "NS1234567890"
        },
        "NS4GRP84": {
            orderNumber: "NS4GRP84",
            status: "Shipped",
            dateLabel: "Estimated delivery",
            date: "August 26, 2026",
            carrier: "North Star Shipping",
            trackingNumber: "NS123456789104"
        }
        };

        const orderKeys = Object.keys(ORDERS);
        let currentKey = orderKeys[0];

        const switcherEl = document.getElementById('switcher');
        const orderCardEl = document.getElementById('orderCard');
        const trackingCardEl = document.getElementById('trackingCard');
        const toastEl = document.getElementById('toast');

        function renderSwitcher(){
        switcherEl.innerHTML = orderKeys.map(k =>
            `<button data-key="${k}" class="${k === currentKey ? 'active' : ''}">#${k}</button>`
        ).join('');
        switcherEl.querySelectorAll('button').forEach(btn=>{
            btn.addEventListener('click', ()=>{
            currentKey = btn.dataset.key;
            renderAll();
            });
        });
        }

        function statusPillMarkup(status){
        const color = STEP_COLOR[status];
        return `<span class="status-pill status-${color}"><i data-lucide="${STEP_ICON[status]}"></i>${status}</span>`;
        }

        function renderOrderCard(order){
        const currentIndex = STEPS.indexOf(order.status);

        const stepsHtml = STEPS.map((step, i)=>{
            const color = STEP_COLOR[step];
            const state = i < currentIndex ? 'done' : (i === currentIndex ? 'current' : '');
            const iconHtml = i <= currentIndex ? `<i data-lucide="${STEP_ICON[step]}"></i>` : '';
            const isLast = i === STEPS.length - 1;
            return `
            <div class="step ${state} c-${color}">
                <div class="step-rail">
                <div class="step-node">${iconHtml}</div>
                ${!isLast ? '<div class="step-line"></div>' : ''}
                </div>
                <div class="step-body">
                <div class="step-label">${step}</div>
                ${state === 'current' ? `<div class="step-meta">${order.dateLabel} — ${order.date}</div>` : ''}
                </div>
            </div>`;
        }).join('');

        orderCardEl.innerHTML = `
            <div class="order-head">
            <div>
                <div class="order-number">ORDER #${order.orderNumber}</div>
                <div class="order-date">${order.dateLabel}: <strong>${order.date}</strong></div>
            </div>
            ${statusPillMarkup(order.status)}
            </div>
            <div class="stepper">${stepsHtml}</div>
        `;
        }

        function renderTrackingCard(order){
        trackingCardEl.innerHTML = `
            <div class="tracking-title">Tracking Details</div>
            <div class="tracking-row"><span class="label">Carrier</span><span class="value">${order.carrier}</span></div>
            <div class="tracking-row"><span class="label">Tracking Number</span><span class="value">${order.trackingNumber}</span></div>
            <button class="track-btn" id="trackBtn"><i data-lucide="external-link"></i>Track on Carrier Site</button>
        `;
        document.getElementById('trackBtn').addEventListener('click', ()=>{
            toastEl.classList.add('show');
            setTimeout(()=> toastEl.classList.remove('show'), 2200);
        });
        }

        function renderAll(){
        renderSwitcher();
        const order = ORDERS[currentKey];
        renderOrderCard(order);
        renderTrackingCard(order);
        if(window.lucide) lucide.createIcons();
        }

        renderAll();
    </script>
</body>
</html>
